<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Custom Monogram -->
  <path d="M30 20V60M30 20L50 50M30 20L10 50M50 50V20M50 50L70 20M70 20V60" 
        stroke="#3B82F6" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Accent Element -->
  <circle cx="30" cy="65" r="3" fill="#3B82F6">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="65" r="3" fill="#3B82F6">
    <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Subtle Glow -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
  </style>
  
  <!-- Text Label -->
  <text x="100" y="30" 
        font-family="'Space Grotesk', sans-serif" 
        font-size="12" 
        font-weight="700" 
        fill="#9CA3AF"
        text-anchor="middle"
        letter-spacing="1px">
    ABHINAV MEDURI
  </text>
</svg>
